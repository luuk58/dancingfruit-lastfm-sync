<video id="fruit" autoplay muted loop playsinline>
	<source src="click.mp4" type="video/mp4">
</video>

<script>
	const bpm_original = 110;
	const video = document.getElementById('fruit');

	function sync(bpm_target) {
		var rate = (bpm_target / bpm_original);
		video.playbackRate = rate;
		video.defaultPlaybackRate = rate;
	}
	sync(110);
</script>
